name: Validate port
on:
  push:
    branches: [main, port/**, upstream/**]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PSTACK_CACHE_DIR: ${{ github.workspace }}/work/pstack-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: bun install --frozen-lockfile
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - run: bun test --timeout 30000 orch watch-pr check-plan.test.ts
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - run: bun run typecheck
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Cusnd/pstack-codex'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pstack-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: work/verified-packages
      - run: python scripts/release.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
