name: Validate port
on:
  push:
    branches: [main, port/**, upstream/**]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PSTACK_CACHE_DIR: ${{ github.workspace }}/work/pstack-cache
      TLA2TOOLS: ${{ github.workspace }}/work/tools/tla2tools.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/setup_statechart.py
      - run: bun install --frozen-lockfile
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - run: bun test --timeout 30000 orch watch-pr check-plan.test.ts
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - run: bun run typecheck
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - run: node --test plugins/pstack-codex/skills/statechart/scripts/test/statechart.test.mjs
      - run: python scripts/package.py
